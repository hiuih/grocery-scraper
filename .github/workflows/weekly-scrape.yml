name: Weekly Grocery Price Scrape

on:
  schedule:
    # 11:00 PM Saturday Pacific ≈ 06:00 UTC Sunday during PDT (roughly Mar–Nov).
    # GitHub Actions cron is fixed UTC and doesn't observe DST, so during PST
    # (roughly Nov–Mar) this actually fires ~1 hour earlier, at 10 PM Pacific.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Override recipient email (for test runs)'
        required: false
        default: ''
      test_mode:
        description: 'Limit each site to a couple categories (fast smoke test)'
        type: boolean
        required: false
        default: false
      disable_proxy:
        description: 'Skip PROXY_LIST for this run (test Save-On-Foods without a proxy)'
        type: boolean
        required: false
        default: false

jobs:
  freshst:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright openpyxl

      - name: Install browser
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Fresh St. Market scraper
        env:
          SCRAPE_CATEGORY_LIMIT: ${{ github.event.inputs.test_mode == 'true' && '2' || '' }}
        run: xvfb-run -a python grocery_scraper.py < /dev/null

      - name: Stage output for upload
        if: always()
        run: |
          mkdir -p output
          cp "$HOME/Desktop/Fresh_St_Market_Products.xlsx" output/ 2>/dev/null || true

      - name: Upload Fresh St. Market output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshst-output
          path: output/
          if-no-files-found: ignore

  saveon:
    runs-on: ubuntu-latest
    # Save-On-Foods routinely takes ~5h on its own (Cloudflare retries add on
    # top of ~815 categories). A single GitHub-hosted job hard-caps at 6h no
    # matter what timeout-minutes says, so this runs in its own job instead
    # of sharing a job (and its clock) with Fresh St. Market.
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install patchright openpyxl

      - name: Install browser
        run: python -m patchright install chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Save-On-Foods scraper
        env:
          SCRAPE_CATEGORY_LIMIT: ${{ github.event.inputs.test_mode == 'true' && '2' || '' }}
          PROXY_LIST: ${{ github.event.inputs.disable_proxy == 'true' && '' || secrets.PROXY_LIST }}
        run: xvfb-run -a python save_on_foods_scraper.py < /dev/null

      - name: Stage output for upload
        if: always()
        run: |
          mkdir -p output
          cp "$HOME/Desktop/Save_On_Foods_Products.xlsx" output/ 2>/dev/null || true

      - name: Upload Save-On-Foods output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saveon-output
          path: output/
          if-no-files-found: ignore

  report:
    needs: [freshst, saveon]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download outputs
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: '*-output'
          merge-multiple: true

      - name: Stage files where send_report.py expects them
        run: |
          mkdir -p "$HOME/Desktop"
          cp downloads/*.xlsx "$HOME/Desktop/" 2>/dev/null || true

      - name: Email results
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          RECIPIENT="${{ github.event.inputs.recipient }}"
          RECIPIENT="${RECIPIENT:-shahbazibmm@gmail.com}"
          python3 scripts/send_report.py "${{ needs.freshst.result }}" "${{ needs.saveon.result }}" "$RECIPIENT"
